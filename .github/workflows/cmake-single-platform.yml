name: Build SBuilderXX

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SBuilderXX.sln

      - name: Build
        run: |
          msbuild SBuilderXX.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:TargetFrameworkVersion=v4.8 `
            /m `
            /v:minimal

      - name: Remove unnecessary files
        shell: pwsh
        run: |
          Get-ChildItem -Path "bin\Release\" -Filter "*.pdb" -Recurse | Remove-Item -Force
          Get-ChildItem -Path "bin\Release\" -Filter "*.xml" -Recurse | Where-Object { Test-Path ($_.FullName -replace '\.xml$', '.dll') } | Remove-Item -Force
          Get-ChildItem -Path "bin\Release\" -Filter "*.dylib" -Recurse | Remove-Item -Force
          Get-ChildItem -Path "bin\Release\" -Filter "*.so" -Recurse | Remove-Item -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SBuilderXX-Release
          path: bin\Release\
          retention-days: 30

      # --- Release publication (runs only when a tag is pushed) ---

      - name: Get short SHA
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Zip output
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (Test-Path "prepackaged") {
            robocopy "prepackaged" "bin\Release" /E /NFL /NDL /NJH /NJS
            if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }
          }
          Compress-Archive `
            -Path "bin\Release\*" `
            -DestinationPath "SBuilderXX-Release-${{ env.SHORT_SHA }}.zip"

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SBuilderXX-Release-${{ env.SHORT_SHA }}.zip
